---
- name: Install and start Nginx on Slave 1
  hosts: web
  become: true
  gather_facts: true

  tasks:
    - name: Confirm target is Ubuntu
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
        fail_msg: "This playbook is intended for Ubuntu EC2 instances."

    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure Nginx is enabled and running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
